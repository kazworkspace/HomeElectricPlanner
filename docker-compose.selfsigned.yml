services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pln-monitor
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_DIR=/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: pln-nginx
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    restart: unless-stopped
